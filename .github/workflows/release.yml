name: Release APK

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build & publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build release APK
        # ciDebugSign: installable APK until a Play Store keystore is configured
        run: ./gradlew :app:assembleRelease -PciDebugSign=true --no-daemon

      - name: Prepare APK artifact
        id: apk
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          SRC="$(find app/build/outputs/apk/release -name '*.apk' -print -quit)"
          test -n "$SRC"
          DEST="nur-${VERSION}.apk"
          cp "$SRC" "$DEST"
          echo "path=${DEST}" >> "${GITHUB_OUTPUT}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Nur ${{ steps.apk.outputs.version }}
          body: |
            ## Nur ${{ steps.apk.outputs.version }}

            Install the APK on Android 7.0+ (API 24).

            > Built with temporary debug signing for distribution via GitHub.
            > Replace with a release keystore before publishing on Play Store.
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
